<title>AI o NON AI? — Quiz dei Gruppi</title>
<style>
  :root{
    --bg:#0f1320; --surface:#181e30; --surface2:#20273f; --line:#2c3450;
    --ink:#eef1fa; --muted:#9aa2bc; --faint:#6b7391;
    --acc:#ffc933; --acc-ink:#1a1405; --acc-dim:#b78d1a;
    --v-ai:#c18cff; --v-ai-bg:rgba(193,140,255,.13);
    --v-real:#3ddc97; --v-real-bg:rgba(61,220,151,.12);
    --err:#ff7a7a;
    --shadow:0 18px 50px rgba(4,6,14,.55);
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f2f4fa;--surface:#fff;--surface2:#eaedf6;--line:#d7dcec;--ink:#161b2c;--muted:#5b6380;--faint:#8b92ad;
      --acc:#ffc933;--acc-ink:#1a1405;--acc-dim:#8a6a00;
      --v-ai:#7a3ff2;--v-ai-bg:rgba(122,63,242,.09);--v-real:#0c9e63;--v-real-bg:rgba(12,158,99,.09);
      --err:#d43d3d;--shadow:0 14px 40px rgba(22,27,44,.14)}
  }
  :root[data-theme="dark"]{--bg:#0f1320;--surface:#181e30;--surface2:#20273f;--line:#2c3450;--ink:#eef1fa;--muted:#9aa2bc;--faint:#6b7391;
    --acc:#ffc933;--acc-ink:#1a1405;--acc-dim:#b78d1a;
    --v-ai:#c18cff;--v-ai-bg:rgba(193,140,255,.13);--v-real:#3ddc97;--v-real-bg:rgba(61,220,151,.12);
    --err:#ff7a7a;--shadow:0 18px 50px rgba(4,6,14,.55)}
  :root[data-theme="light"]{--bg:#f2f4fa;--surface:#fff;--surface2:#eaedf6;--line:#d7dcec;--ink:#161b2c;--muted:#5b6380;--faint:#8b92ad;
    --acc:#ffc933;--acc-ink:#1a1405;--acc-dim:#8a6a00;
    --v-ai:#7a3ff2;--v-ai-bg:rgba(122,63,242,.09);--v-real:#0c9e63;--v-real-bg:rgba(12,158,99,.09);
    --err:#d43d3d;--shadow:0 14px 40px rgba(22,27,44,.14)}

  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-dim);font-weight:600}
  .label{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}

  .wrap{max-width:640px;margin:0 auto;padding:1.6rem 1.1rem 6rem}
  .wrap.wide{max-width:920px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:1.8rem 1.5rem;margin-top:1rem}
  @media (min-width:640px){.card{padding:2.2rem 2.2rem}}
  .big-title{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;letter-spacing:-.03em;line-height:1;margin:.5rem 0 .9rem;text-wrap:balance}
  .big-title .oppure{color:var(--acc)}
  .lead{color:var(--muted);font-size:1rem;margin:.5rem 0}
  .lead b{color:var(--ink)}

  .btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:.7rem 1.1rem;font-size:.95rem;font-weight:700}
  .btn:hover{border-color:var(--acc)}
  .btn-acc{background:var(--acc);color:var(--acc-ink);border:none;font-weight:800}
  .btn-acc:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn-big{width:100%;font-size:1.1rem;padding:1rem 1.2rem;border-radius:14px;margin-top:.8rem}

  .mode-btns{display:grid;gap:.9rem;margin-top:1.4rem}
  .mode-btn{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:1.1rem 1.2rem;color:var(--ink)}
  .mode-btn:hover{border-color:var(--acc)}
  .mode-btn .m-t{font-weight:900;font-size:1.2rem}
  .mode-btn .m-d{color:var(--muted);font-size:.88rem;margin-top:.2rem}

  input[type=text], textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-family:inherit;font-size:1.05rem;padding:.85rem 1rem}
  textarea{min-height:9rem;resize:vertical;font-family:var(--mono);font-size:.9rem}

  /* quiz studente */
  .prog{display:flex;gap:.35rem;margin:.6rem 0 1rem;flex-wrap:wrap}
  .pg{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);min-width:14px}
  .pg.done{background:var(--acc);border-color:var(--acc)}
  .pg.cur{border-color:var(--acc)}
  .q-title{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:.4rem 0 .7rem;text-wrap:balance}
  .q-desc{font-size:1rem;color:var(--muted);margin:0 0 1rem}
  .poem{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.2rem,4.5vw,1.6rem);line-height:1.5;background:var(--surface2);border-radius:14px;padding:1.2rem 1.4rem;margin:0 0 1rem;white-space:pre-line;font-style:italic}
  .newsbox{font-size:clamp(1.05rem,3.5vw,1.25rem);line-height:1.5;background:var(--surface2);border-radius:14px;padding:1.1rem 1.3rem;margin:0 0 1rem;font-weight:600}
  .show-link{display:inline-flex;align-items:center;gap:.6rem;background:var(--acc);color:var(--acc-ink);text-decoration:none;
    font-weight:900;font-size:1.02rem;border-radius:12px;padding:.85rem 1.2rem;margin:0 0 1rem}
  .show-link small{font-weight:600;font-size:.72rem;opacity:.75}
  .ans-btns{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:1.2rem}
  .ans-btns button{font-size:1.6rem;font-weight:900;letter-spacing:.04em;padding:1.1rem 0;border-radius:16px;border:3px solid;background:transparent}
  .ans-btns .e-ai{color:var(--v-ai);border-color:var(--v-ai);background:var(--v-ai-bg)}
  .ans-btns .e-vero{color:var(--v-real);border-color:var(--v-real);background:var(--v-real-bg)}
  .ans-btns button:disabled{opacity:.45}
  .ans-btns button.picked{outline:4px solid var(--acc);outline-offset:2px}

  .verdict{margin-top:1.2rem;border-top:1px solid var(--line);padding-top:1.1rem}
  .v-flag{font-weight:900;font-size:1.3rem;margin-bottom:.4rem}
  .v-flag.ok{color:var(--v-real)} .v-flag.ko{color:var(--err)}
  .v-why{background:var(--surface2);border-radius:12px;padding:.9rem 1.1rem;font-size:.95rem;color:var(--muted)}
  .v-why b{color:var(--ink)}

  /* fine test */
  .score-big{font-size:clamp(3rem,14vw,4.5rem);font-weight:900;letter-spacing:-.03em;color:var(--acc);font-variant-numeric:tabular-nums;text-align:center;margin:.4rem 0}
  .lv{text-align:center;font-weight:900;font-size:1.3rem;margin-bottom:1rem}
  .codebox{background:var(--surface2);border:2px dashed var(--acc);border-radius:14px;padding:1rem 1.1rem;
    font-family:var(--mono);font-size:1.05rem;font-weight:700;text-align:center;word-break:break-all;user-select:all;margin:.8rem 0}
  .copied{color:var(--v-real);font-weight:700;text-align:center;min-height:1.4rem;margin:0}

  /* cattedra */
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
  .chip{display:inline-flex;align-items:center;gap:.45rem;background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:.35rem .5rem .35rem .9rem;font-weight:600;font-size:.9rem}
  .chip .ok{color:var(--v-real);font-family:var(--mono);font-size:.75rem}
  .chip button{border:none;background:transparent;color:var(--faint);font-size:1rem;line-height:1;padding:.1rem .3rem}
  .chip button:hover{color:var(--err)}
  .reg-count{font-family:var(--mono);font-size:.85rem;color:var(--acc-dim);margin:.5rem 0}
  .warn{color:var(--err);font-size:.88rem;margin:.4rem 0}

  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:1.4rem 0;text-align:left}
  .group{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;animation:popIn .3s ease both}
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.group{animation:none}}
  .group .g-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
  .group .g-emoji{font-size:1.8rem}
  .group .g-name{font-weight:900;font-size:1.2rem}
  .group ul{margin:.2rem 0 .6rem;padding-left:1.2rem}
  .group li{margin:.2rem 0;font-weight:600}
  .group .g-sim{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
  .row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1rem}
  .row .btn{flex:1;min-width:9rem}
</style>

<div id="app"></div>

<script>
"use strict";
/* ---------- 12 domande (6 AI / 6 VERO) ---------- */
const Q = [
 { cat:"📷 FOTO", title:"Il Papa col piumino bianco",

 { cat:"📷 FOTO", title:"L'aurora boreale… sull'Italia",

   link:"https://www.google.com/search?udm=2&q=aurora+boreale+italia+maggio+2024", linkLabel:"Guarda le foto",

 { cat:"📷 FOTO", title:"La «Willy Wonka Experience» di Glasgow",

 { cat:"📷 FOTO", title:"L'antilope saiga",
   desc:"Un'antilope con una proboscide gonfiabile che sembra uscita da Star Wars.",

 { cat:"🎬 VIDEO", title:"La lucertola che corre sull'acqua",
   desc:"Una lucertola attraversa uno stagno correndo sulla superficie, come in un cartone.",
   link:"https://www.youtube.com/results?search_query=basilisk+lizard+running+on+water", linkLabel:"Guarda il video",
   answer:"VERO", why:"Il basilisco esiste: filmato dai documentaristi di BBC e National Geographic." },
 { cat:"🎬 VIDEO", title:"ASMR: tagliare la frutta di vetro",
   desc:"Un coltello affetta una mela di vetro con un suono cristallino perfetto.",
   link:"https://www.youtube.com/results?search_query=glass+fruit+cutting+asmr+ai", linkLabel:"Guarda il video",
   answer:"AI", why:"Generato con Veo 3: video e suono creati insieme dall'AI." },
 { cat:"🎬 VIDEO", title:"Il polpo invisibile",
   desc:"Un cespuglio di alghe «esplode», cambia colore e diventa un polpo che schizza via.",
   link:"https://www.youtube.com/results?search_query=octopus+camouflage+reveal+diver", linkLabel:"Guarda il video",
   answer:"VERO", why:"Mimetismo del polpo, documentato dal biologo marino Roger Hanlon." },
 { cat:"✍️ TESTO", title:"Tre versi",
   poem:"Ognuno sta solo sul cuor della terra\ntrafitto da un raggio di sole:\ned è subito sera.",
   answer:"VERO", why:"Salvatore Quasimodo, premio Nobel 1959. «Troppo semplice» è un pregiudizio." },
 { cat:"✍️ TESTO", title:"Altri quattro versi",
   poem:"La sera scende\ncome una mano\nche chiude gli occhi\nal mondo stanco.",
   answer:"AI", why:"Generata da un modello linguistico: levigata, prevedibile, senza spigoli." },
 { cat:"✍️ TESTO", title:"Notizia assurda",
   news:"«Nel 2009 in Sudafrica un piccione viaggiatore con una chiavetta USB ha trasferito 4 GB di dati più in fretta della connessione internet dell'azienda.»",
   answer:"VERO", why:"Il piccione Winston batté davvero la linea ADSL: 2 ore e 7 minuti contro il 4% di download." },
 { cat:"🎧 MUSICA", title:"Johnny Cash canta «Barbie Girl»",
   desc:"La voce profonda di Johnny Cash (morto nel 2003) canta il tormentone degli Aqua.",
   link:"https://www.youtube.com/results?search_query=johnny+cash+barbie+girl+ai", linkLabel:"Ascolta il brano",
   answer:"AI", why:"Clonazione vocale dichiarata come parodia («There I Ruined It», 2023)." }
];
const NQ = Q.length;
const ANIMALS = [
 ["🦁","Leoni"],["🦄","Unicorni"],["🦌","Gazzelle"],["🦅","Aquile"],
 ["🦊","Volpi"],["🐬","Delfini"],["🐆","Ghepardi"],["🦉","Gufi"],
 ["🐺","Lupi"],["🐯","Tigri"],["🐻","Orsi"],["🦈","Squali"]
];

/* ---------- stato ---------- */
const SKEY = "ainonai-quiz-v2";
let S = { mode:null, name:"", qi:0, answers:[], teacher:{students:[], groups:null} };
try{ const sv=JSON.parse(localStorage.getItem(SKEY)); if(sv && typeof sv==="object" && "mode" in sv) S=sv; }catch(e){}
const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }

function render(){
  if(S.mode==="student") renderStudent();
  else if(S.mode==="teacher") renderTeacher();
  else renderStart();
  window.scrollTo(0,0);
}

/* ---------- start ---------- */
function renderStart(){
  app.innerHTML = `
  <div class="wrap">
    <div class="card" style="text-align:center">
      <div class="eyebrow">Quiz dei Gruppi · 12 domande</div>
      <h1 class="big-title">AI <span class="oppure">o</span> NON AI?</h1>
      <p class="lead">Fai il test sul tuo telefono: alla fine ottieni un <b>codice risultato</b> da mandare al prof.
      Chi risponde in modo simile finisce nello stesso gruppo.</p>
      <div class="mode-btns">
        <button class="mode-btn" onclick="S.mode='student';save();render()">
          <div class="m-t">📱 Sono uno studente</div>
          <div class="m-d">Scrivi il tuo nome, rispondi alle 12 domande, invia il codice al prof.</div>
        </button>
        <button class="mode-btn" onclick="S.mode='teacher';save();render()">
          <div class="m-t">🖥️ Cattedra (prof)</div>
          <div class="m-d">Incolla i codici ricevuti dai ragazzi e crea i gruppi.</div>
        </button>
      </div>
    </div>
  </div>`;
}

/* ---------- studente ---------- */
function renderStudent(){
  if(!S.name) return renderName();
  if(S.qi < NQ) return renderQuestion();
  renderDone();
}
function renderName(){
  app.innerHTML = `
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">Iscrizione</div>
      <h1 class="big-title">Come ti chiami?</h1>
      <p class="lead">Nome e iniziale del cognome bastano (es. <b>Giulia R.</b>). Poi rispondi da solo: niente aiutini… anche se sappiamo che copierete 😏</p>
      <input type="text" id="nm" maxlength="30" placeholder="Il tuo nome…" autocomplete="off">
      <button class="btn btn-acc btn-big" onclick="setName()">Inizia il test →</button>
      <button class="btn btn-big" onclick="S.mode=null;save();render()">← Indietro</button>
    </div>
  </div>`;
  const inp=document.getElementById("nm");
  inp.focus();
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") setName(); });
}
function setName(){
  const v=document.getElementById("nm").value.trim();
  if(!v) return;
  S.name=v; S.qi=0; S.answers=[]; save(); render();
}
function renderQuestion(){
  const i=S.qi, q=Q[i], picked=S.answers[i];
  app.innerHTML = `
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">${q.cat} · domanda ${i+1} di ${NQ} · ${esc(S.name)}</div>
      <div class="prog">${Q.map((_,k)=>`<span class="pg${S.answers[k]?" done":k===i?" cur":""}"></span>`).join("")}</div>
      <h2 class="q-title">${q.title}</h2>
      ${q.desc?`<p class="q-desc">${q.desc}</p>`:""}
      ${q.poem?`<div class="poem">${esc(q.poem)}</div>`:""}
      ${q.news?`<div class="newsbox">${q.news}</div>`:""}
      ${q.link?`<a class="show-link" href="${esc(q.link)}" target="_blank" rel="noopener">▶ ${q.linkLabel} <small>(nuova scheda)</small></a>`:""}
      <div class="ans-btns">
        <button class="e-ai${picked==="AI"?" picked":""}" onclick="pick('AI')" ${picked?"disabled":""}>AI</button>
        <button class="e-vero${picked==="VERO"?" picked":""}" onclick="pick('VERO')" ${picked?"disabled":""}>VERO</button>
      </div>
      ${picked?`
      <div class="verdict">
        <div class="v-flag ${picked===q.answer?"ok":"ko"}">${picked===q.answer?"✔ Giusto!":"✘ Era "+q.answer}</div>
        <div class="v-why"><b>Perché:</b> ${q.why}</div>
        <button class="btn btn-acc btn-big" onclick="S.qi++;save();render()">${i<NQ-1?"Prossima domanda →":"Vedi il risultato →"}</button>
      </div>`:""}
    </div>
  </div>`;
}
function pick(v){ if(S.answers[S.qi]) return; S.answers[S.qi]=v; save(); render(); }

function myCode(){
  return S.name.trim()+"-"+S.answers.map(a=>a==="AI"?"A":"V").join("");
}
function renderDone(){
  const score=S.answers.reduce((a,v,k)=>a+(v===Q[k].answer?1:0),0);
  const lv = score<=4?"🐣 Apprendista": score<=7?"🔍 Osservatore": score<=10?"🕵️ Detective digitale":"🏆 Caccia-falsi";
  app.innerHTML = `
  <div class="wrap">
    <div class="card">
      <div class="eyebrow" style="text-align:center">Test completato, ${esc(S.name)}!</div>
      <div class="score-big">${score}/${NQ}</div>
      <div class="lv">${lv}</div>
      <p class="lead" style="text-align:center"><b>Ultimo passo:</b> manda questo codice al prof
      (chat di classe o mostraglielo). Serve per formare i gruppi.</p>
      <div class="codebox" id="code">${esc(myCode())}</div>
      <p class="copied" id="copied"></p>
      <button class="btn btn-acc btn-big" onclick="copyCode()">📋 Copia il codice</button>
      <button class="btn btn-big" onclick="if(confirm('Rifare il test cancella le tue risposte. Sicuro?')){S.name='';S.qi=0;S.answers=[];save();render()}">↺ Rifai il test</button>
    </div>
  </div>`;
}
function copyCode(){
  const t=myCode(), el=document.getElementById("copied");
  const done=()=>{ el.textContent="Copiato! Ora incollalo nella chat ✔"; };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done).catch(()=>{ selectCode(); });
  else selectCode();
  function selectCode(){
    const r=document.createRange(); r.selectNodeContents(document.getElementById("code"));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    el.textContent="Tieni premuto sul codice e scegli «Copia»";
  }
}

/* ---------- cattedra ---------- */
function parseCodes(text){
  const out=[];
  text.split(/\n/).forEach(line=>{
    const m=line.match(/([AV]{12})(?![AV])/i);
    if(!m) return;
    const code=m[1].toUpperCase();
    let name=line.replace(m[1],"").replace(/[-:·,;|>]+/g," ").replace(/\s+/g," ").trim();
    name=name.replace(/^\[.*?\]\s*/,"");
    if(!name) name="Anonimo";
    out.push({name, answers:code.split("").map(c=>c==="A"?"AI":"VERO")});
  });
  return out;
}
function addCodes(){
  const ta=document.getElementById("codes");
  const found=parseCodes(ta.value);
  found.forEach(st=>{
    const k=S.teacher.students.findIndex(x=>x.name.toLowerCase()===st.name.toLowerCase());
    if(k>=0) S.teacher.students[k]=st; else S.teacher.students.push(st);
  });
  ta.value=""; S.teacher.groups=null; save(); render();
}
function renderTeacher(){
  if(S.teacher.groups) return renderResults();
  const n=S.teacher.students.length;
  const sizes=n?groupSizes(n):[];
  app.innerHTML = `
  <div class="wrap wide">
    <div class="card">
      <div class="eyebrow">Cattedra · raccolta codici</div>
      <h1 class="big-title">Incolla i codici dei ragazzi</h1>
      <p class="lead">Copia i messaggi dalla chat di classe e incollali qui sotto, tutti insieme: la pagina trova da sola
      le righe tipo <b>Marco-AVVAVAVVAVAV</b> e ignora il resto.</p>
      <textarea id="codes" placeholder="Marco-AVVAVAVVAVAV&#10;Giulia R.-VAVAVVAVAVAV&#10;…"></textarea>
      <button class="btn btn-acc btn-big" onclick="addCodes()">Aggiungi codici ↵</button>
      <div class="reg-count">${n} iscritti${n?` · si formeranno ${sizes.length} gruppi da ${Math.min(...sizes)}–${Math.max(...sizes)}`:""}</div>
      <div class="chips">${S.teacher.students.map((st,k)=>`<span class="chip">${esc(st.name)} <span class="ok">✓</span><button aria-label="Rimuovi ${esc(st.name)}" onclick="S.teacher.students.splice(${k},1);save();render()">✕</button></span>`).join("")}</div>
      ${n>0 && n<6 ? `<p class="warn">Servono almeno 6 iscritti per formare i gruppi.</p>`:""}
      <div class="row">
        <button class="btn" onclick="S.mode=null;save();render()">← Inizio</button>
        ${n?`<button class="btn" onclick="if(confirm('Cancellare tutti i codici raccolti?')){S.teacher.students=[];S.teacher.groups=null;save();render()}">Svuota</button>`:""}
        <button class="btn btn-acc" onclick="makeGroups()" ${n<6?"disabled":""}>🎉 Crea i gruppi →</button>
      </div>
    </div>
  </div>`;
}

function groupSizes(n){
  const g=Math.max(1,Math.ceil(n/4));
  const base=Math.floor(n/g), rem=n%g;
  const sizes=[]; for(let k=0;k<g;k++) sizes.push(base+(k<rem?1:0));
  return sizes.sort((a,b)=>b-a);
}
function sim(a,b){ let s=0; for(let k=0;k<NQ;k++) if(a[k]&&a[k]===b[k]) s++; return s; }
function makeGroups(){
  const ST=S.teacher.students;
  const idx=[...ST.keys()];
  for(let k=idx.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [idx[k],idx[j]]=[idx[j],idx[k]]; }
  const sizes=groupSizes(idx.length);
  const unassigned=new Set(idx);
  const groups=[];
  sizes.forEach(size=>{
    const seed=unassigned.values().next().value;
    unassigned.delete(seed);
    const rest=[...unassigned].map(k=>({k, s:sim(ST[seed].answers, ST[k].answers)}))
      .sort((a,b)=>b.s-a.s).slice(0,size-1);
    rest.forEach(r=>unassigned.delete(r.k));
    const members=[seed,...rest.map(r=>r.k)];
    let common=0;
    for(let qk=0;qk<NQ;qk++){
      const first=ST[members[0]].answers[qk];
      if(first && members.every(m=>ST[m].answers[qk]===first)) common++;
    }
    groups.push({members, common});
  });
  groups.sort((a,b)=>b.common-a.common);
  S.teacher.groups=groups; save(); render();
}

function renderResults(){
  const ST=S.teacher.students, G=S.teacher.groups;
  app.innerHTML = `
  <div class="wrap wide">
    <div class="card" style="text-align:center">
      <div class="eyebrow">Risultato · ${G.length} gruppi</div>
      <h1 class="big-title">Ecco le squadre! 🎉</h1>
      <p class="lead" style="text-align:center">Formate per somiglianza di risposte.</p>
      <div class="groups">
        ${G.map((g,gi)=>{
          const [emoji,name]=ANIMALS[gi%ANIMALS.length];
          return `<div class="group" style="animation-delay:${gi*0.1}s">
            <div class="g-head"><span class="g-emoji">${emoji}</span><span class="g-name">${name}</span></div>
            <ul>${g.members.map(m=>`<li>${esc(ST[m].name)}</li>`).join("")}</ul>
            <div class="g-sim">d'accordo su ${g.common}/${NQ} domande</div>
          </div>`;
        }).join("")}
      </div>
      <div class="row">
        <button class="btn" onclick="S.teacher.groups=null;save();render()">← Codici</button>
        <button class="btn" onclick="makeGroups()">🎲 Rimescola</button>
        <button class="btn btn-acc" onclick="if(confirm('Nuova partita: cancella codici e gruppi. Sicuro?')){S.teacher={students:[],groups:null};save();render()}">↺ Nuova partita</button>
      </div>
    </div>
  </div>`;
}

render();
</script>
