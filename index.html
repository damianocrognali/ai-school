const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  if(view.name==="home") renderHome();

}

function renderCard(r,i){
  const R = ROUNDS[r], it = R.items[i];
  const key = r+"-"+i, isRev = !!revealed[key];
  const v = VERDICTS[it.answer];
  app.innerHTML = `
  <div class="shell">
    ${topbar(r,i)}
    <div class="stage">
      <div class="card">
        <div class="eyebrow">Round ${R.name} · Esercizio ${i+1} di ${R.items.length}</div>
        <h2 class="ex-title">${it.title}</h2>
        ${it.desc ? `<p class="ex-desc">${it.desc}</p>` : ""}
        ${it.poem ? `<div class="poem">${esc(it.poem)}${it.poemTr?`<span class="tr">${esc(it.poemTr)}</span>`:""}</div>` : ""}
        ${it.cerca ? `<div class="cerca">🔎 Cerca: <b>${esc(it.cerca)}</b></div>` : ""}
        <div class="vote-strip">
          <span class="label">La classe vota</span>
          <span class="vote-opt o-ai">${R.opts[0]}</span><span class="vote-vs">vs</span>
          <span class="vote-opt o-real">${R.opts[1]}</span>
        </div>
        ${isRev ? `
        <div class="reveal">
          <div class="stamp-row">
            <span class="stamp ${v.cls}">${v.label}</span>
            ${it.answer==="MISTO"?`<span class="stamp-note">Origine mista: parte umana, parte AI — il bello è discutere dove passa il confine.</span>`:""}
            ${it.answer==="FALSO"?`<span class="stamp-note">Falso, ma fabbricato da mani umane: i falsi esistevano molto prima dell'AI.</span>`:""}
          </div>
          <div class="reveal-block"><span class="label">Indizi</span><p>${it.indizi}</p></div>
          <div class="reveal-block disc"><span class="label">Discussione</span><p>${it.disc}</p></div>
          ${it.links ? `<p class="links">Link per il conduttore:<br>${it.links.map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("<br>")}</p>` : ""}
        </div>` : ""}
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="prev()">← Indietro</button>
      ${isRev
        ? `<button class="btn btn-acc btn-reveal" onclick="next()">${i<R.items.length-1?"Prossimo esercizio →":(r<ROUNDS.length-1?"Round successivo →":"Fine partita → Menu")}</button>`
        : `<button class="btn btn-acc btn-reveal" onclick="reveal()">👁 RIVELA</button>`}
      <button class="btn" onclick="next()" ${isRev?"disabled":""}>Salta →</button>
    </div>
  </div>`;
}

function topbar(r,i){
  const R = ROUNDS[r];
  return `
  <div class="topbar">
    <button class="btn" onclick="goHome()">☰ Menu</button>
    <span class="round-name">Round ${r+1} · ${R.name}</span>
    <div class="dots">${R.items.map((_,k)=>{
      const cls = "dot"+(revealed[r+"-"+k]?" done":"")+(i===k?" cur":"");
      return `<button class="${cls}" aria-label="Esercizio ${k+1}" onclick="goCard(${r},${k})"></button>`;
    }).join("")}</div>
    <button class="btn" onclick="toggleScore()">🏆 Punteggio</button>
  </div>`;
}

/* ---------------- NAVIGATION ---------------- */
function countDone(r){ return ROUNDS[r].items.reduce((a,_,k)=>a+(revealed[r+"-"+k]?1:0),0); }
function goHome(){ view={name:"home"}; render(); }
function goIntro(r){ view={name:"intro",r}; render(); }
function goCard(r,i){ view={name:"card",r,i}; render(); }
function reveal(){ if(view.name!=="card") return; revealed[view.r+"-"+view.i]=true; render(); }
function next(){
  if(view.name==="intro"){ goCard(view.r,0); return; }
  if(view.name!=="card") return;
  const R = ROUNDS[view.r];
  if(view.i < R.items.length-1) goCard(view.r, view.i+1);
  else if(view.r < ROUNDS.length-1) goIntro(view.r+1);
  else goHome();
}
function prev(){
  if(view.name!=="card") return;
  if(view.i>0) goCard(view.r, view.i-1); else goIntro(view.r);
}

/* ---------------- SCOREBOARD ---------------- */
const SKEY = "ainonai-score";
let score;
try{ score = JSON.parse(localStorage.getItem(SKEY)) || null; }catch(e){ score = null; }
if(!Array.isArray(score) || score.length!==4)
  score = [1,2,3,4].map(n=>({name:"Squadra "+n, pts:0}));

function saveScore(){ try{ localStorage.setItem(SKEY, JSON.stringify(score)); }catch(e){} }
function renderTeams(){
  document.getElementById("teams").innerHTML = score.map((t,k)=>`
    <div class="team">
      <span class="tname" contenteditable="true" spellcheck="false" data-k="${k}">${esc(t.name)}</span>
      <button class="tbtn" onclick="addPt(${k},-1)" aria-label="Togli un punto">−</button>
      <span class="tscore">${t.pts}</span>
      <button class="tbtn" onclick="addPt(${k},1)" aria-label="Aggiungi un punto">+</button>
    </div>`).join("");
  document.querySelectorAll(".tname").forEach(el=>{
    el.addEventListener("blur",()=>{ score[+el.dataset.k].name = el.textContent.trim()||("Squadra "+(+el.dataset.k+1)); saveScore(); renderTeams(); });
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
  });
}
function addPt(k,d){ score[k].pts=Math.max(0,score[k].pts+d); saveScore(); renderTeams(); }
function resetScore(){ score.forEach(t=>t.pts=0); saveScore(); renderTeams(); }
function toggleScore(force){
  const dr = document.getElementById("scoreDrawer");
  const open = force!==undefined ? force : !dr.classList.contains("open");
  dr.classList.toggle("open", open);
}

/* ---------------- KEYBOARD ---------------- */
document.addEventListener("keydown", e=>{
  if(e.target.isContentEditable) return;
  if(e.key==="Escape"){ toggleScore(false); goHome(); return; }
  if(e.key==="p"||e.key==="P"){ toggleScore(); return; }
  if(view.name==="home") return;
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    if(view.name==="intro"){ goCard(view.r,0); }
    else if(!revealed[view.r+"-"+view.i]) reveal();
    else next();
  }
  else if(e.key==="ArrowRight"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
});

renderTeams();
render();
</script>
