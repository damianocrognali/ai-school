    answer:"VERO", why:"La Grande inondazione di melassa di Boston è documentata da giornali dell'epoca, processi e libri di storia. Per decenni, nei giorni caldi, il quartiere profumava di caramello.",
    verify:"https://en.wikipedia.org/wiki/Great_Molasses_Flood",
    comp:"La realtà è spesso meno plausibile della finzione: assurdo non significa falso." },
  { title:"Notizia plausibile",
    news:"«Il Ministero dell'Istruzione sperimenta in 50 scuole un registro elettronico che rileva gli sbadigli con la webcam per misurare il livello di attenzione in classe.»",
    answer:"AI", why:"Inventata per questa partita. Suona vera perché è costruita con pezzi veri (registro elettronico, webcam, scuole pilota). Ma se la cerchi, nessuna testata la riporta.",
    comp:"Il metodo che non scade: cercare la notizia. Se nessuna fonte affidabile la riporta, allarme rosso." }
]},
{ id:"musica", name:"MUSICA", icon:"🎧",
  tile:"La canzone dei Nirvana mai scritta e la popstar che non esiste (ma non è AI).",
  intro:"Ascolto di 30–60 secondi a occhi chiusi, poi timer e voto. I brani si aprono dal bottone giallo.",
  items:[
  { title:"La canzone «dei Nirvana»",
    desc:"«Drowned in the Sun»: voce, chitarre e stile di Kurt Cobain, morto nel 1994. Pubblicata nel 2021.",
    link:"https://www.youtube.com/results?search_query=drowned+in+the+sun+nirvana+ai", linkLabel:"Ascolta il brano",
    answer:"AI", why:"Progetto «Lost Tapes of the 27 Club»: musica generata da un'AI addestrata sui Nirvana, cantata da un interprete, per parlare di salute mentale nei musicisti.",
    comp:"Le voci e gli stili si clonano: conta chi lo dichiara e perché lo fa." },
  { title:"La popstar che riempie gli stadi",
    desc:"Una cantante con i capelli turchesi fa concerti sold-out da anni: sul palco c'è solo un ologramma, la voce è interamente sintetica.",
    link:"https://www.youtube.com/results?search_query=hatsune+miku+live+concert", linkLabel:"Guarda un concerto",
    answer:"VERO", why:"Hatsune Miku esiste dal 2007: è un software (Vocaloid) con la voce campionata da un'attrice. Niente AI generativa: ogni canzone è scritta nota per nota da autori umani.",
    comp:"Sintetico non significa AI: anche qui, «suona finto» non dice chi l'ha creato." }
]}];

/* numerazione globale 1..N per il foglietto */
let n = 0; CATS.forEach(c => c.items.forEach(it => { it.num = ++n; }));
const TOTAL = n;

let view = { name:"home" };   // home | intro | q | end
let revealed = {};            // "c-i" -> true
let timerId = null, timerLeft = 0;
const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer(); timerLeft = 20; paintTimer();
  timerId = setInterval(()=>{ timerLeft--; paintTimer(); if(timerLeft<=0) stopTimer(); }, 1000);
}
function paintTimer(){
  const el = document.getElementById("timer"); if(!el) return;
  el.textContent = timerLeft>0 ? "⏱ "+String(timerLeft).padStart(2,"0")+" s" : "⏱ STOP ✋";
  el.className = "timer "+(timerLeft>0?"run":"zero");
}

function render(){
  stopTimer();
  if(view.name==="home") renderHome();
  else if(view.name==="intro") renderIntro(view.c);
  else if(view.name==="end") renderEnd();
  else renderQ(view.c, view.i);
  window.scrollTo(0,0);
}

function countDone(c){ return CATS[c].items.reduce((a,_,k)=>a+(revealed[c+"-"+k]?1:0),0); }

function renderHome(){
  app.innerHTML = `
  <div class="home">
    <div class="hero">
      <div class="eyebrow">Partita 2 · sfida individuale · tutti esempi nuovi</div>
      <h1 class="hero-title">AI <span class="oppure">o</span> NON AI?</h1>
      <p class="hero-sub">${TOTAL} contenuti mai visti nella prima partita. Niente cellulari: servono solo lo schermo,
      un foglietto e una penna a testa.</p>
      <div class="hero-badges">
        <span class="pill">4 categorie</span><span class="pill">${TOTAL} sfide</span>
        <span class="pill">Punteggio individuale</span><span class="pill">~40 minuti</span>
      </div>
    </div>

    <div class="cat-grid">
      ${CATS.map((c,idx)=>`
        <button class="cat-tile" onclick="goIntro(${idx})">
          <span class="ct-num">${c.icon} CATEGORIA ${idx+1}</span>
          <span class="ct-name">${c.name}</span>
          <span class="ct-desc">${c.tile}</span>
          <span class="ct-count">sfide ${c.items[0].num}–${c.items[c.items.length-1].num} · ${countDone(idx)}/${c.items.length} rivelate</span>
        </button>`).join("")}
    </div>

    <section class="home-section">
      <h2>Come si gioca</h2>
      <ol class="steps">
        <li>Ogni studente scrive sul foglietto i numeri da <b>1 a ${TOTAL}</b> (la numerazione continua tra le categorie).</li>
        <li>Il conduttore mostra il contenuto — foto, video, testo o brano — con un clic sul <b>bottone giallo</b>, e avvia il <b>timer di 20 secondi</b>.</li>
        <li>Ognuno scrive <b>AI</b> oppure <b>VERO</b>. Poi si preme <b>RIVELA</b>: risposta, spiegazione e la competenza che quella sfida allena.</li>
        <li>Ci si corregge da soli (✓/✗). Alla fine, la schermata <b>Correzione</b> riepiloga tutte le risposte e assegna i livelli.</li>
      </ol>
      <p><strong>Variante veloce (20 min):</strong> gioca solo FOTO + VIDEO, oppure una categoria a scelta della classe.</p>
    </section>

    <section class="home-section">
      <h2>Numeri che colpiscono <span class="label">— da citare durante la partita</span></h2>
      <div class="numbers">
        <div class="num-card"><div class="big">46,6%</div><p>accuratezza media nel riconoscere poesie AI — peggio del lancio di una moneta (studio su 1.634 persone, 2024)</p></div>
        <div class="num-card"><div class="big">Milioni</div><p>di persone credettero vera la foto del Papa col piumino: il primo grande inganno AI di massa (2023)</p></div>
        <div class="num-card"><div class="big">8 mln</div><p>di spettatori in diretta per il salto dallo spazio di Baumgartner: gli eventi veri lasciano tracce enormi (2012)</p></div>
        <div class="num-card"><div class="big">2 sec</div><p>il tempo che serve per generare oggi un'immagine falsa: verificarla richiede di più — per questo vince chi verifica</p></div>
      </div>
    </section>

    <section class="home-section golden">
      <h2>🥇 La regola d'oro da lasciare alla classe</h2>
      <p>Gli indizi visivi (mani, scritte, ombre) sono utili oggi e inutili domani. Il metodo che non scade:
      <strong>fermarsi, cercare la fonte, cercare conferme indipendenti.</strong> Chi l'ha pubblicato per primo?
      Lo riporta una testata affidabile? La ricerca inversa dell'immagine (Google Lens) cosa mostra?</p>
      <p><strong>Vince chi verifica, non chi ha l'occhio.</strong></p>
    </section>

    <section class="home-section">
      <h2>Fonti per il conduttore</h2>
      <ul class="sources">
        <li>The Guardian / BBC — «Balenciaga Pope», l'immagine Midjourney del Papa (2023)</li>
        <li>404 Media / Stanford — «Shrimp Jesus» e l'AI slop su Facebook (2024)</li>
        <li>AP / fact-checker — la bambina col cucciolo dell'uragano Helene è AI (2024)</li>
        <li>OpenAI — video dimostrativi di Sora, «Tokyo walk» (2024)</li>
        <li>Diep Nep — deepfake dichiarato «This is not Morgan Freeman» (2021)</li>
        <li>Red Bull Stratos — telemetria e diretta del salto di Baumgartner (2012)</li>
        <li>National Geographic — «Free Solo», El Capitan senza corda (2017)</li>
        <li>Rolling Stone — «Drowned in the Sun», il progetto Lost Tapes of the 27 Club (2021)</li>
        <li>Crypton Future Media — Hatsune Miku e la tecnologia Vocaloid</li>
        <li>Wikipedia — Great Molasses Flood, Boston 1919</li>
        <li>Porter &amp; Machery — studio sulle poesie AI, Scientific Reports (2024)</li>
      </ul>
    </section>

    <p class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> naviga · <kbd>spazio</kbd> rivela/avanti · <kbd>T</kbd> timer · <kbd>Esc</kbd> menu</p>
  </div>`;
}

function renderIntro(c){
  const C = CATS[c];
  app.innerHTML = `
  <div class="shell">
    ${topbar(c,null)}
    <div class="stage"><div class="card center">
      <div class="eyebrow">${C.icon} Categoria ${c+1} · sfide ${C.items[0].num}–${C.items[C.items.length-1].num}</div>
      <h1 class="big-title">${C.name}</h1>
      <p class="lead">${C.intro}</p>
      <div class="vote-strip" style="justify-content:center">
        <span class="label">Sul foglietto</span>
        <span class="vote-opt o-ai">AI</span><span class="vote-vs">oppure</span><span class="vote-opt o-real">VERO</span>
      </div>
    </div></div>
    <div class="controls">
      <button class="btn" onclick="goHome()">← Menu</button>
      <button class="btn btn-acc btn-reveal" onclick="goQ(${c},0)">Inizia →</button>
    </div>
  </div>`;
}

function renderQ(c,i){
  const C = CATS[c], q = C.items[i];
  const key = c+"-"+i, isRev = !!revealed[key];
  const vClass = q.answer==="AI" ? "v-ai" : "v-real";
  app.innerHTML = `
  <div class="shell">
    ${topbar(c,i)}
    <div class="stage"><div class="card">
      <div class="eyebrow">${C.icon} ${C.name} · scrivi la risposta n. ${q.num} sul foglietto</div>
      <h2 class="q-title">${q.title}</h2>
      ${q.desc?`<p class="q-desc">${q.desc}</p>`:""}
      ${q.poem?`<div class="poem">${esc(q.poem)}</div>`:""}
      ${q.news?`<div class="newsbox">${q.news}</div>`:""}
      ${q.link?`<a class="show-link" href="${esc(q.link)}" target="_blank" rel="noopener">▶ ${q.linkLabel} <small>(nuova scheda)</small></a>`:""}
      <div class="vote-strip">
        <span class="label">Sul foglietto</span>
        <span class="vote-opt o-ai">AI</span><span class="vote-vs">oppure</span><span class="vote-opt o-real">VERO</span>
      </div>
      ${isRev?`
      <div class="reveal">
        <span class="stamp ${vClass}">${q.answer}</span>
        <div class="reveal-block"><span class="label">Perché</span><p>${q.why}</p></div>
        <div class="reveal-block comp"><span class="label">Cosa allena</span><p>${q.comp}</p></div>
        ${q.verify?`<p class="verify">Verifica: <a href="${esc(q.verify)}" target="_blank" rel="noopener">${esc(q.verify)}</a></p>`:""}
      </div>`:""}
    </div></div>
    <div class="controls">
      <button class="btn" onclick="prev()">← Indietro</button>
      ${isRev
        ? `<button class="btn btn-acc btn-reveal" onclick="next()">${nextLabel(c,i)}</button>`
        : `<button class="btn btn-acc btn-reveal" onclick="reveal()">👁 RIVELA</button>`}
    </div>
  </div>`;
}

function nextLabel(c,i){
  if(i < CATS[c].items.length-1) return "Prossima sfida →";
  if(c < CATS.length-1) return "Categoria "+CATS[c+1].name+" →";
  return "Correzione e livelli →";
}

function topbar(c,i){
  const C = CATS[c];
  return `
  <div class="topbar">
    <button class="btn" onclick="goHome()">☰ Menu</button>
    <span class="tt">${C.icon} ${C.name}</span>
    <div class="dots">${C.items.map((_,k)=>{
      const cls="dot"+(revealed[c+"-"+k]?" done":"")+(i===k?" cur":"");
      return `<button class="${cls}" aria-label="Sfida ${CATS[c].items[k].num}" onclick="goQ(${c},${k})"></button>`;
    }).join("")}</div>
    <button id="timer" class="timer" onclick="startTimer()">⏱ 20 s</button>
  </div>`;
}

function renderEnd(){
  app.innerHTML = `
  <div class="shell"><div class="stage">
    <div class="card center">
      <div class="eyebrow">Correzione finale</div>
      <h1 class="big-title">Quante ne hai azzeccate?</h1>
      ${CATS.map(c=>`
        <div class="key-cat"><span class="label">${c.icon} ${c.name}</span></div>
        <div class="key-grid">
          ${c.items.map(q=>`<div class="key-item"><span class="kn">${q.num}.</span><span class="kv ${q.answer==="AI"?"ai":"vero"}">${q.answer}</span></div>`).join("")}
        </div>`).join("")}
      <div class="rubric">
        <div class="rub"><div class="pts">0–8 PUNTI</div><div class="lv">🐣 Apprendista</div><p>Ti fidi dell'occhio: da oggi, fermati e verifica.</p></div>
        <div class="rub"><div class="pts">9–13 PUNTI</div><div class="lv">🔍 Osservatore</div><p>Noti gli indizi giusti, ma qualche falso passa ancora.</p></div>
        <div class="rub"><div class="pts">14–17 PUNTI</div><div class="lv">🕵️ Detective digitale</div><p>Occhio allenato e sano sospetto: quasi imbattibile.</p></div>
        <div class="rub"><div class="pts">18–20 PUNTI</div><div class="lv">🏆 Caccia-falsi</div><p>Livello massimo: ora insegna il metodo ai compagni.</p></div>
      </div>
      <div class="golden-box">
        <p><b>🥇 La regola d'oro:</b> gli indizi visivi sono utili oggi e inutili domani. Il metodo che non scade:
        <b>fermarsi, cercare la fonte, cercare conferme indipendenti.</b></p>
        <p><b>Vince chi verifica, non chi ha l'occhio.</b></p>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" onclick="goHome()">☰ Menu</button>
    <button class="btn btn-acc btn-reveal" onclick="restart()">↺ Nuova partita</button>
  </div></div>`;
}

function goHome(){ view={name:"home"}; render(); }
function goIntro(c){ view={name:"intro",c}; render(); }
function goQ(c,i){ view={name:"q",c,i}; render(); }
function goEnd(){ view={name:"end"}; render(); }
function reveal(){ if(view.name!=="q") return; revealed[view.c+"-"+view.i]=true; render(); }
function next(){
  if(view.name==="intro"){ goQ(view.c,0); return; }
  if(view.name!=="q") return;
  const C = CATS[view.c];
  if(view.i < C.items.length-1) goQ(view.c, view.i+1);
  else if(view.c < CATS.length-1) goIntro(view.c+1);
  else goEnd();
}
function prev(){
  if(view.name!=="q") return;
  if(view.i>0) goQ(view.c, view.i-1); else goIntro(view.c);
}
function restart(){ revealed={}; goHome(); }

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ goHome(); return; }
  if(view.name==="home"||view.name==="end") return;
  if(e.key==="t"||e.key==="T"){ startTimer(); return; }
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    if(view.name==="intro") goQ(view.c,0);
    else if(!revealed[view.c+"-"+view.i]) reveal();
    else next();
  }
  else if(e.key==="ArrowRight"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
});
render();
</script>
